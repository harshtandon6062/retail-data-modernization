# Quieter Spark logs for a readable demo. Real errors still raise in Python.
rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n
# Hive tries a "Hive-compatible" ALTER for Delta tables, logs an ERROR, then
# correctly falls back to Spark's own format. Harmless, so we silence it.
logger.hivealter.name = org.apache.hadoop.hive.metastore.HiveAlterHandler
logger.hivealter.level = off
logger.hivecat.name = org.apache.spark.sql.hive.HiveExternalCatalog
logger.hivecat.level = off
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = off
logger.hms.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.hms.level = off
