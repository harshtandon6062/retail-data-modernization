# CI: unit tests + the full batch pipeline against a throw-away PostgreSQL.
name: ci
on:
  push:
  pull_request:
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Maven/Ivy jars downloaded by spark.jars.packages
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('src/common.py') }}
      - name: Install
        run: make setup
      - name: Unit tests
        run: make test
      - name: Batch pipeline end to end (legacy -> bronze -> silver -> gold -> CDC -> governance -> validation -> BI)
        # `postgres` target is skipped: the service container is already running
        run: make legacy ingest register silver gold cdc governance validate bi mapreduce
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            docs/data_catalog.md
            dashboard/index.html
